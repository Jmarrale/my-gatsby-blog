name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - claude/home-security-intake-site-9bdxqm
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage static site
        run: |
          mkdir -p _site/assets
          cp index.html security.html technology.html thanks.html deck.html _site/
          cp assets/styles.css _site/assets/
      # Publishes to the aurum/ folder of the gh-pages branch (the branch
      # this repo's Pages serves from). keep_files preserves the other
      # demos already hosted at the branch root.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          destination_dir: aurum
          keep_files: true
